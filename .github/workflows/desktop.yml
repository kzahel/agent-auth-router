name: Desktop candidate
on:
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'package*.json', 'tsconfig*.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', 'desktop/**', 'package*.json', 'tsconfig*.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize candidate artifacts (does not publish a release)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            node: arm64
          - target: x86_64-apple-darwin
            node: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: rustup target add ${{ matrix.target }}
      - name: Check core and native shell
        run: |
          npm run check
          npm --prefix desktop run prepare:bundle
          npm --prefix desktop run check
      - name: Browser management regression
        if: matrix.node == 'arm64'
        run: |
          cd desktop
          npx playwright install chromium
          npm test
      - name: Build bundled app
        env:
          AAR_BUNDLE_ARCH: ${{ matrix.node }}
        run: npm --prefix desktop run build -- --target ${{ matrix.target }}
      - name: Verify package composition
        run: node desktop/scripts/verify-package.mjs 'desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Agent Auth Router.app'
      - name: Import candidate signing identity
        if: inputs.signed == true
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD" && test -n "$API_KEY"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aar.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/aar.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aar.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/aar.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aar.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/aar.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/aar.keychain-db"
      - name: Sign final bytes and notarize
        if: inputs.signed == true
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: desktop/scripts/sign-macos.sh 'desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Agent Auth Router.app' 'artifacts/candidate-${{ matrix.node }}'
      - name: Upload signed immutable candidate
        if: inputs.signed == true
        uses: actions/upload-artifact@v4
        with:
          name: signed-candidate-${{ github.sha }}-${{ matrix.node }}
          path: artifacts/candidate-${{ matrix.node }}
          if-no-files-found: error
          retention-days: 30
      - name: Clean signing materials
        if: always() && inputs.signed == true
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/aar.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
