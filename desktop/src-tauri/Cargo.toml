[package]
name = "agent-auth-router-desktop"
version = "0.1.10"
edition = "2021"
authors = ["Kyle Graehl <kgraehl@gmail.com>"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde_json = "1"
portable-pty = "=0.9.0"
libc = "0.2"

[profile.dev]
debug = "line-tables-only"
incremental = false
